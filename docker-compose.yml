services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sewingstudio-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongPass123!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StrongPass123!' -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sewingstudio-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=SewingStudioDb;User Id=sa;Password=StrongPass123!;TrustServerCertificate=True;"
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver_data: